    <!--
      Pre-paint bootstrap: apply the saved theme and motion preference before the first
      frame, so light-theme visitors never see a dark flash. Also decides whether the
      preloader plays (on every load and refresh, never with motion off).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem('akshit-portfolio-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          root.setAttribute('data-theme', theme);
          root.className = theme;
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
          }

          var motion = localStorage.getItem('akshit-portfolio-motion');
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var motionOff = motion === 'off' || (motion === null && reduce);
          if (motionOff) {
            root.setAttribute('data-motion', 'off');
          }

          if (motionOff) root.setAttribute('data-preload', 'skip');
          else root.classList.add('is-preloading');
        } catch (e) {
          /* Fallback on storage errors: proceed without breaking styles */
        }
      })();
    </script>

    <!-- Preloader ("build log") styles: inline so they apply on the very first frame -->
    <style>
      html.is-preloading { overflow: hidden; }
      html[data-preload='skip'] .preloader { display: none; }
      .preloader {
        --pl-bg: #0a0a0a;
        --pl-panel: #111111;
        --pl-fg: #ededed;
        --pl-muted: #a1a1a1;
        --pl-dim: #6f6f6f;
        --pl-line: rgba(255, 255, 255, 0.08);
        --pl-ok: #34d399;
        --pl-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 30px 80px -30px rgba(0, 0, 0, 0.9);
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 16px;
        background: var(--pl-bg);
        color: var(--pl-fg);
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
        transition: opacity 500ms cubic-bezier(0.22, 1, 0.36, 1), visibility 500ms;
      }
      html[data-theme='light'] .preloader {
        --pl-bg: #ffffff;
        --pl-panel: #fafafa;
        --pl-fg: #0a0a0a;
        --pl-muted: #52525b;
        --pl-dim: #8a8a93;
        --pl-line: rgba(0, 0, 0, 0.08);
        --pl-ok: #047857;
        --pl-shadow: 0 30px 70px -36px rgba(0, 0, 0, 0.25);
      }
      /* Faint grid behind the panel */
      .preloader::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, var(--pl-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--pl-line) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 50% 45% at 50% 50%, #000 10%, transparent 75%);
        mask-image: radial-gradient(ellipse 50% 45% at 50% 50%, #000 10%, transparent 75%);
      }
      .preloader.is-done { opacity: 0; visibility: hidden; }
      .pl-panel {
        position: relative;
        width: min(440px, 100%);
        border: 1px solid var(--pl-line);
        border-radius: 12px;
        background: var(--pl-panel);
        box-shadow: var(--pl-shadow);
        overflow: hidden;
        animation: plIn 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
        transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .preloader.is-done .pl-panel { transform: translateY(-8px) scale(0.985); }
      .pl-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 14px;
        border-bottom: 1px solid var(--pl-line);
        font-size: 12px;
        color: var(--pl-dim);
      }
      .pl-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--pl-fg); font-weight: 500; }
      .pl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pl-ok); }
      .pl-env { margin-left: auto; }
      .pl-body { padding: 14px 16px 16px; font-size: 12.5px; line-height: 1; }
      .pl-cmd { display: flex; gap: 8px; margin-bottom: 14px; color: var(--pl-muted); }
      .pl-cmd b { font-weight: 400; color: var(--pl-dim); }
      .pl-steps { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 11px; min-height: 84px; }
      .pl-step {
        display: grid;
        grid-template-columns: 14px 1fr auto;
        align-items: center;
        gap: 10px;
        color: var(--pl-muted);
        animation: plLine 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pl-step.is-ok { color: var(--pl-fg); }
      .pl-icon { position: relative; width: 12px; height: 12px; }
      .pl-step:not(.is-ok) .pl-icon {
        border: 1.5px solid var(--pl-line);
        border-top-color: var(--pl-fg);
        border-radius: 50%;
        animation: plSpin 700ms linear infinite;
      }
      .pl-step.is-ok .pl-icon::after {
        content: '';
        position: absolute;
        left: 3.5px;
        top: 0.5px;
        width: 4px;
        height: 8px;
        border: solid var(--pl-ok);
        border-width: 0 1.6px 1.6px 0;
        transform: rotate(45deg);
      }
      .pl-ms { color: var(--pl-dim); font-variant-numeric: tabular-nums; }
      .pl-progress { display: flex; align-items: center; gap: 12px; color: var(--pl-dim); font-size: 11.5px; }
      .pl-track { position: relative; flex: 1; height: 2px; border-radius: 2px; background: var(--pl-line); overflow: hidden; }
      .pl-fill {
        position: absolute;
        inset: 0;
        background: var(--pl-fg);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pl-pct { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
      .pl-ready {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-top: 1px solid var(--pl-line);
        font-size: 12.5px;
        color: var(--pl-dim);
      }
      .pl-ready.is-on { color: var(--pl-ok); }
      .pl-ready.is-on .pl-ready-text { animation: plLine 260ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .pl-caret {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: var(--pl-fg);
        opacity: 0.8;
        animation: plBlink 1s steps(1) infinite;
      }
      .pl-ready.is-on .pl-caret { display: none; }
      .pl-hint { position: relative; font-size: 11px; color: var(--pl-dim); letter-spacing: 0.02em; }
      .pl-hint kbd {
        font: inherit;
        padding: 1px 5px;
        margin: 0 2px;
        border: 1px solid var(--pl-line);
        border-radius: 4px;
      }
      @keyframes plIn { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }
      @keyframes plLine { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
      @keyframes plSpin { to { transform: rotate(360deg); } }
      @keyframes plBlink { 50% { opacity: 0; } }
      @media (max-width: 420px) {
        .pl-body { padding: 12px 14px 14px; font-size: 12px; }
        .pl-env { display: none; }
      }
    </style>

  <body>
    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="pl-panel">
        <div class="pl-bar">
          <span class="pl-brand"><span class="pl-dot"></span>akshitsharma.dev</span>
          <span class="pl-env">production · main</span>
        </div>
        <div class="pl-body">
          <div class="pl-cmd"><b>$</b><span>npm run build</span></div>
          <ol class="pl-steps" id="pl-steps"></ol>
          <div class="pl-progress">
            <span class="pl-track"><span class="pl-fill" id="pl-fill"></span></span>
            <span class="pl-pct" id="pl-pct">0%</span>
          </div>
        </div>
        <div class="pl-ready" id="pl-ready"><span class="pl-ready-text" id="pl-ready-text">building</span><span class="pl-caret"></span></div>
      </div>
      <p class="pl-hint">press <kbd>any key</kbd> to skip</p>
    </div>
    <script>
      /*
        Build-log preloader: four steps stream in and tick off, the bar fills, then a real
        "ready in Xms" (time since navigation) shows and the overlay lifts. Plays on every load;
        skipped with motion off (see the pre-paint script). Any key / click / tap skips it.
      */
      (function () {
        var el = document.getElementById('preloader');
        var root = document.documentElement;
        function finish() {
          window.__preloaderDone = true;
          window.dispatchEvent(new Event('preloader:done'));
        }
        if (!el || root.getAttribute('data-preload') === 'skip') {
          if (el) el.parentNode.removeChild(el);
          finish();
          return;
        }

        var STEPS = [
          ['compiling agents', 142],
          ['indexing vector store', 88],
          ['wiring langgraph workflows', 203],
          ['optimizing bundle', 117]
        ];
        var STEP_MS = 230;
        var list = document.getElementById('pl-steps');
        var fill = document.getElementById('pl-fill');
        var pct = document.getElementById('pl-pct');
        var ready = document.getElementById('pl-ready');
        var readyText = document.getElementById('pl-ready-text');
        var timers = [];
        var closed = false;
        var loaded = document.readyState === 'complete';
        var logDone = false;

        function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
        function setProgress(p) {
          fill.style.transform = 'scaleX(' + p + ')';
          pct.textContent = Math.round(p * 100) + '%';
        }

        function close() {
          if (closed) return;
          closed = true;
          timers.forEach(clearTimeout);
          window.removeEventListener('keydown', close, true);
          window.removeEventListener('pointerdown', close, true);
          el.classList.add('is-done');
          root.classList.remove('is-preloading');
          finish();
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 550);
        }

        function maybeClose() { if (loaded && logDone) later(close, 420); }

        STEPS.forEach(function (step, i) {
          later(function () {
            var li = document.createElement('li');
            li.className = 'pl-step';
            li.innerHTML = '<span class="pl-icon"></span><span></span><span class="pl-ms"></span>';
            li.children[1].textContent = step[0];
            list.appendChild(li);
            later(function () {
              li.classList.add('is-ok');
              li.children[2].textContent = step[1] + 'ms';
              setProgress((i + 1) / STEPS.length);
            }, STEP_MS - 40);
          }, i * STEP_MS);
        });

        later(function () {
          var ms = Math.round(window.performance && performance.now ? performance.now() : STEPS.length * STEP_MS);
          readyText.textContent = '✓ ready in ' + ms + 'ms';
          ready.classList.add('is-on');
          logDone = true;
          maybeClose();
        }, STEPS.length * STEP_MS + 80);

        if (!loaded) {
          window.addEventListener('load', function () { loaded = true; maybeClose(); });
        }
        window.addEventListener('keydown', close, true);
        window.addEventListener('pointerdown', close, true);
        setTimeout(close, 4000);
      })();
    </script>
