    <!--
      Pre-paint bootstrap: apply the saved theme and motion preference before the first
      frame, so light-theme visitors never see a dark flash. Also decides whether the
      preloader plays (on every load and refresh, never with motion off).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          // Theme follows the OS until the visitor picks one with the toggle
          var stored = localStorage.getItem('akshit-portfolio-theme-choice');
          var osDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : osDark ? 'dark' : 'light';
          root.setAttribute('data-theme', theme);
          root.className = theme;

          var palette = localStorage.getItem('akshit-portfolio-palette');
          if (!/^(crimson|cobalt|lime|orange)$/.test(palette || '')) palette = 'crimson';
          root.setAttribute('data-palette', palette);

          var bgs = {
            'crimson-light': '#faf8f5', 'crimson-dark': '#0b0a0a',
            'cobalt-light': '#f7f8fa', 'cobalt-dark': '#070a14',
            'lime-light': '#f4f4ef', 'lime-dark': '#0b0b0a',
            'orange-light': '#fbf7f2', 'orange-dark': '#0d0a08'
          };
          root.style.setProperty('--pl-page', bgs[palette + '-' + theme]);
          var accents = { crimson: '#d7263d', cobalt: '#2f5bff', lime: '#7da30a', orange: '#ff5a1f' };
          root.style.setProperty('--pl-accent', accents[palette]);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bgs[palette + '-' + theme]);

          var motion = localStorage.getItem('akshit-portfolio-motion');
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var motionOff = motion === 'off' || (motion === null && reduce);
          if (motionOff) {
            root.setAttribute('data-motion', 'off');
          }

          if (motionOff) root.setAttribute('data-preload', 'skip');
          else root.classList.add('is-preloading');
        } catch (e) {
          /* Fallback on storage errors: proceed without breaking styles */
        }
      })();
    </script>

    <!-- Intro loader styles: inline so they apply on the very first frame -->
    <style>
      html.is-preloading { overflow: hidden; }
      html[data-preload='skip'] .preloader { display: none; }
      .preloader {
        --pl-bg: var(--pl-page, #0a0a0a);
        --pl-fg: #ededed;
        --pl-dim: rgba(237, 237, 237, 0.5);
        --pl-card: rgba(237, 237, 237, 0.06);
        --pl-line: rgba(237, 237, 237, 0.12);
        --pl-ease: cubic-bezier(0.76, 0, 0.24, 1);
        position: fixed;
        inset: 0;
        z-index: 100000;
        overflow: hidden;
        color: var(--pl-fg);
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html[data-theme='light'] .preloader {
        --pl-fg: #141414;
        --pl-dim: rgba(20, 20, 20, 0.5);
        --pl-card: rgba(20, 20, 20, 0.045);
        --pl-line: rgba(20, 20, 20, 0.1);
      }
      /* The two halves the screen splits into */
      .pl-half {
        position: absolute;
        left: 0;
        right: 0;
        height: 50.5%;
        background: var(--pl-bg);
        transition: transform 900ms var(--pl-ease);
      }
      .pl-half.top { top: 0; }
      .pl-half.bottom { bottom: 0; }
      .preloader.is-leaving .pl-half.top { transform: translateY(-100%); }
      .preloader.is-leaving .pl-half.bottom { transform: translateY(100%); }

      .pl-stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        transition: opacity 260ms ease;
      }
      .preloader.is-leaving .pl-stage,
      .preloader.is-leaving .pl-col,
      .preloader.is-leaving .pl-hint { opacity: 0; transition: opacity 220ms ease; }

      /* Title card: name builds in word by word, then the role line ticks in under it */
      .pl-tagline {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(14px, 2vw, 22px);
        max-width: 92vw;
        text-align: center;
        transition: opacity 380ms ease, transform 600ms var(--pl-ease), filter 400ms ease;
      }
      .pl-name {
        margin: 0;
        font-size: clamp(44px, 9vw, 120px);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }
      .pl-role {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 0;
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(11px, 1.2vw, 13px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pl-role > span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid var(--pl-line);
        border-radius: 999px;
        color: var(--pl-dim);
      }
      .pl-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pl-accent, #e5484d);
      }
      .pl-name > span,
      .pl-role > span {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.35em);
        filter: blur(6px);
        animation: plWord 560ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(var(--i) * 110ms + 120ms);
      }
      .pl-role > span { display: inline-flex; transform: translateY(8px); }

      /* Cards stream up both sides */
      .pl-col {
        position: absolute;
        top: 0;
        width: clamp(96px, 12vw, 150px);
        display: flex;
        flex-direction: column;
        gap: 14px;
        transform: translateY(100vh);
        animation: plStream 2600ms cubic-bezier(0.3, 0.1, 0.3, 1) forwards;
      }
      .pl-col.left { left: clamp(16px, 4vw, 56px); }
      .pl-col.right { right: clamp(16px, 4vw, 56px); animation-delay: 160ms; }
      .pl-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        aspect-ratio: 4 / 5;
        padding: 10px;
        border: 1px solid var(--pl-line);
        border-radius: 14px;
        background: var(--pl-card);
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--pl-dim);
      }
      .pl-card b { font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 600; color: var(--pl-fg); }
      .pl-card.hot { background: var(--pl-accent, #e5484d); border-color: transparent; color: rgba(255, 255, 255, 0.8); }
      .pl-card.hot b { color: #fff; }
      .pl-hint {
        position: absolute;
        left: 50%;
        bottom: clamp(20px, 4vw, 40px);
        transform: translateX(-50%);
        margin: 0;
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--pl-dim);
        opacity: 0;
        animation: plFade 600ms ease 900ms forwards;
        white-space: nowrap;
      }
      @keyframes plWord { to { opacity: 1; transform: none; filter: none; } }
      @keyframes plStream { to { transform: translateY(-110%); } }
      @keyframes plFade { to { opacity: 0.8; } }
      @media (max-width: 640px) {
        .pl-col, .pl-hint { display: none; }
      }
    </style>

    <script>
      /*
        Intro loader: a name + role title card builds in word by word (CSS) while cards
        stream up both sides, then the screen splits open onto the page. About 2.1s; waits for
        the page load if needed; skipped with motion off; any key / click / tap jumps to the split.
      */
      (function () {
        var el = document.getElementById('preloader');
        var root = document.documentElement;
        function finish() {
          if (window.__preloaderDone) return;
          window.__preloaderDone = true;
          window.dispatchEvent(new Event('preloader:done'));
        }
        if (!el || root.getAttribute('data-preload') === 'skip') {
          if (el) el.parentNode.removeChild(el);
          finish();
          return;
        }

        var loaded = document.readyState === 'complete';
        var minDone = false;
        var leaving = false;

        function leave() {
          if (leaving) return;
          leaving = true;
          window.removeEventListener('keydown', leave, true);
          window.removeEventListener('pointerdown', leave, true);
          el.classList.add('is-leaving');
          root.classList.remove('is-preloading');
          // Start the hero entrance as the halves part, so they overlap
          setTimeout(finish, 220);
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
        }
        function maybeLeave() { if (minDone && loaded) leave(); }
        if (!loaded) window.addEventListener('load', function () { loaded = true; maybeLeave(); });

        setTimeout(function () { minDone = true; maybeLeave(); }, 2050);
        window.addEventListener('keydown', leave, true);
        window.addEventListener('pointerdown', leave, true);
        setTimeout(leave, 4500);
      })();
    </script>
