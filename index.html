    <!--
      Pre-paint bootstrap: apply the saved theme and motion preference before the first
      frame, so light-theme visitors never see a dark flash. Also decides whether the
      preloader plays (on every load and refresh, never with motion off).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem('akshit-portfolio-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          root.setAttribute('data-theme', theme);
          root.className = theme;
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
          }

          var motion = localStorage.getItem('akshit-portfolio-motion');
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var motionOff = motion === 'off' || (motion === null && reduce);
          if (motionOff) {
            root.setAttribute('data-motion', 'off');
          }

          if (motionOff) root.setAttribute('data-preload', 'skip');
          else root.classList.add('is-preloading');
        } catch (e) {
          /* Fallback on storage errors: proceed without breaking styles */
        }
      })();
    </script>

    <!-- Preloader ("counter + curtain") styles: inline so they apply on the very first frame -->
    <style>
      html.is-preloading { overflow: hidden; }
      html[data-preload='skip'] .preloader { display: none; }
      .preloader {
        --pl-bg: #0a0a0a;
        --pl-fg: #ededed;
        --pl-dim: rgba(237, 237, 237, 0.5);
        --pl-line: rgba(237, 237, 237, 0.14);
        --pl-ease: cubic-bezier(0.76, 0, 0.24, 1);
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(20px, 4vw, 48px);
        background: var(--pl-bg);
        color: var(--pl-fg);
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        will-change: transform;
        transition: transform 850ms var(--pl-ease);
      }
      html[data-theme='light'] .preloader {
        --pl-bg: #ffffff;
        --pl-fg: #0a0a0a;
        --pl-dim: rgba(10, 10, 10, 0.5);
        --pl-line: rgba(10, 10, 10, 0.12);
      }
      /* Curtain: the whole screen slides up */
      .preloader.is-leaving { transform: translateY(-100%); }

      .pl-top,
      .pl-bottom {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        transition: opacity 400ms ease, transform 600ms var(--pl-ease);
      }
      .pl-top { align-items: flex-start; }
      .pl-bottom { align-items: flex-end; }
      .preloader.is-leaving .pl-top,
      .preloader.is-leaving .pl-bottom { opacity: 0; transform: translateY(-24px); }

      .pl-mask { display: block; overflow: hidden; }
      .pl-mask > span {
        display: block;
        animation: plRise 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pl-name { font-size: clamp(15px, 1.5vw, 18px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; }
      .pl-role { font-size: clamp(13px, 1.2vw, 15px); color: var(--pl-dim); line-height: 1.4; }
      .pl-role > span { animation-delay: 80ms; }
      .pl-meta {
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--pl-dim);
        text-align: right;
        line-height: 1.6;
      }
      .pl-meta > span { animation-delay: 140ms; }

      .pl-bottom-left { display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 0; padding-bottom: 0.6em; }
      .pl-track { position: relative; width: min(420px, 100%); height: 1px; background: var(--pl-line); overflow: hidden; }
      .pl-fill {
        position: absolute;
        inset: 0;
        background: var(--pl-fg);
        transform: scaleX(0);
        transform-origin: left center;
      }
      .pl-place .pl-mask > span { animation-delay: 200ms; }

      .pl-count {
        display: flex;
        align-items: flex-start;
        font-size: clamp(88px, 17vw, 220px);
        font-weight: 500;
        line-height: 0.78;
        letter-spacing: -0.065em;
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        padding-top: 0.04em;
      }
      .pl-count > span { animation: plRise 900ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both; }
      .pl-pct {
        margin: 0.12em 0 0 0.08em;
        font-size: 0.16em;
        letter-spacing: 0;
        color: var(--pl-dim);
      }
      .pl-hint {
        position: absolute;
        left: 50%;
        bottom: clamp(20px, 4vw, 48px);
        transform: translateX(-50%);
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--pl-dim);
        opacity: 0;
        animation: plFade 600ms ease 700ms forwards;
        white-space: nowrap;
      }
      @keyframes plRise { from { transform: translateY(105%); } to { transform: none; } }
      @keyframes plFade { to { opacity: 0.8; } }
      @media (max-width: 600px) {
        .pl-meta, .pl-hint { display: none; }
        .pl-bottom { flex-direction: column-reverse; align-items: flex-start; gap: 20px; }
        .pl-bottom-left { width: 100%; padding-bottom: 0; }
        .pl-track { width: 100%; }
      }
    </style>

    <script>
      /*
        Counter + curtain preloader: a 0→100 counter and a hairline progress line run for ~1.6s
        (holding near the end until the page has loaded), then the screen slides up like a
        curtain and the hero animates in underneath. Plays on every load; skipped with motion
        off (see the pre-paint script). Any key / click / tap jumps straight to the curtain.
      */
      (function () {
        var el = document.getElementById('preloader');
        var root = document.documentElement;
        function finish() {
          if (window.__preloaderDone) return;
          window.__preloaderDone = true;
          window.dispatchEvent(new Event('preloader:done'));
        }
        if (!el || root.getAttribute('data-preload') === 'skip') {
          if (el) el.parentNode.removeChild(el);
          finish();
          return;
        }

        var countEl = document.getElementById('pl-count');
        var fillEl = document.getElementById('pl-fill');
        var DURATION = 1450;   // counter run time (ms); the curtain adds ~0.85s on top, mostly overlapping the hero entrance
        var HOLD_AT = 0.9;     // if the page is still loading, the counter waits here
        var loaded = document.readyState === 'complete';
        var start = null;
        var leaving = false;
        var raf = 0;

        if (!loaded) window.addEventListener('load', function () { loaded = true; });

        // easeInOutCubic: slow start, quick middle, gentle landing on 100
        function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

        function render(p) {
          countEl.textContent = String(Math.round(p * 100));
          fillEl.style.transform = 'scaleX(' + p + ')';
        }

        function leave() {
          if (leaving) return;
          leaving = true;
          cancelAnimationFrame(raf);
          window.removeEventListener('keydown', leave, true);
          window.removeEventListener('pointerdown', leave, true);
          render(1);
          el.classList.add('is-leaving');
          root.classList.remove('is-preloading');
          // Start the hero entrance as the curtain begins to lift, so they overlap
          setTimeout(finish, 180);
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 950);
        }

        function tick(now) {
          if (start === null) start = now;
          var t = Math.min((now - start) / DURATION, 1);
          var p = ease(t);
          if (!loaded && p > HOLD_AT) p = HOLD_AT;
          render(p);
          if (p >= 1) {
            setTimeout(leave, 160);
            return;
          }
          raf = requestAnimationFrame(tick);
        }

        raf = requestAnimationFrame(tick);
        window.addEventListener('keydown', leave, true);
        window.addEventListener('pointerdown', leave, true);
        setTimeout(leave, 4500);
      })();
    </script>
